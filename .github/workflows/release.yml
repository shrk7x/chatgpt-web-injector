name: Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
      timezone: 'America/Denver'
  workflow_dispatch:
    inputs:
      publish_pending:
        description: 'Run the weekly release process now (tests, merges and publishes the pending release)'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Existing release tag to retry publishing (leave empty to run release-please)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Weekly merges use GITHUB_TOKEN, so create their release in this same run.
concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ !inputs.release_tag }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.weekly_release.outputs.tag_name || steps.release.outputs.tag_name }}
      release_created: ${{ steps.weekly_release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: release-please-manifest.json

      - name: Checkout weekly release helpers
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_pending)) && steps.release.outputs.release_created != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Find pending weekly release
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_pending)) && steps.release.outputs.release_created != 'true' }}
        id: pending
        uses: actions/github-script@v7
        with:
          script: |
            const { findReleasePullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/weekly_release.js`);
            const pull = await findReleasePullRequest({ github, context });
            if (!pull) {
              await core.summary.addRaw('No pending release; skipping this week.').write();
              return;
            }
            core.setOutput('number', pull.number);
            core.setOutput('sha', pull.head.sha);

      - name: Checkout release candidate
        if: ${{ steps.pending.outputs.number }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pending.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: ${{ steps.pending.outputs.number }}
        with:
          node-version: '22'
          cache: npm

      - name: Test release candidate before merging
        if: ${{ steps.pending.outputs.number }}
        run: |
          npm ci
          npm test

      - name: Merge tested weekly release
        if: ${{ steps.pending.outputs.number }}
        uses: actions/github-script@v7
        env:
          RELEASE_PR_NUMBER: ${{ steps.pending.outputs.number }}
          RELEASE_PR_SHA: ${{ steps.pending.outputs.sha }}
        with:
          script: |
            const { mergeReleasePullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/weekly_release.js`);
            await mergeReleasePullRequest({
              github, context,
              number: Number(process.env.RELEASE_PR_NUMBER),
              sha: process.env.RELEASE_PR_SHA
            });

      - name: Create release after weekly merge
        if: ${{ steps.pending.outputs.number }}
        uses: googleapis/release-please-action@v4
        id: weekly_release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: release-please-manifest.json

      - name: Checkout code
        if: ${{ steps.weekly_release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.weekly_release.outputs.tag_name || steps.release.outputs.tag_name }}
          persist-credentials: false

      - name: Create extension zip
        if: ${{ steps.weekly_release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.weekly_release.outputs.tag_name || steps.release.outputs.tag_name }}
        run: |
          ZIP_NAME="${RELEASE_TAG}.zip"
          zip -r "$ZIP_NAME" \
            manifest.json \
            src/ \
            options/ \
            popup/ \
            icons/ \
            -x "*.DS_Store*"
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Release Asset
        if: ${{ steps.weekly_release.outputs.release_created == 'true' || steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.weekly_release.outputs.tag_name || steps.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$ZIP_PATH"

  publish-store:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: chrome-web-store-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test publisher and extension
        run: |
          npm ci
          npm test

      - name: Download the exact release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(chatgpt-web-injector-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as chatgpt-web-injector-v0.1.2.' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/store-release.json"
          jq -e '.isDraft == false and .isPrerelease == false' "$RUNNER_TEMP/store-release.json"
          ASSET_NAME=$(jq -er --arg tag "${RELEASE_TAG}.zip" \
            --arg prefixed "chatgpt-web-injector-v${RELEASE_TAG##*v}.zip" \
            '[.assets[].name | select(. == $tag or . == $prefixed)] |
             if length == 1 then .[0] else error("Expected exactly one extension ZIP") end' \
            "$RUNNER_TEMP/store-release.json")
          mkdir -p "$RUNNER_TEMP/store-release"
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/store-release"
          ZIP_PATH="$RUNNER_TEMP/store-release/$ASSET_NAME"
          VERSION=$(unzip -p "$ZIP_PATH" manifest.json | jq -er '.version')
          test "$VERSION" = "${RELEASE_TAG##*v}"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "EXTENSION_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Authenticate to Google with GitHub identity
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Publish to Chrome Web Store
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        run: node scripts/chrome_webstore.js "$ZIP_PATH" "$EXTENSION_VERSION"
